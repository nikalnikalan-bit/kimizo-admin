<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kimizo Admin – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#D8141C;--bg:#f7f1ee;--card:#fff;--ink:#1d1416;--mute:#6f6366;--line:#eadcd6}
@media(prefers-color-scheme:dark){:root{--bg:#181012;--card:#241a1d;--ink:#f6ecea;--mute:#b3a3a6;--line:#3a2a2e}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.logo{font-family:'Archivo Black',Impact,sans-serif;color:var(--red);font-size:28px;letter-spacing:-1px}
h1{margin:6px 0 2px;font-size:20px}
p.sub{margin:0 0 8px;color:var(--mute);font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #1B2A6B;outline-offset:2px}
.btn{width:100%;margin-top:18px;padding:11px;background:var(--red);color:#fff;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
#err{min-height:20px;margin:12px 0 0;color:var(--red);font-size:14px;font-weight:700}
</style>
</head>
<body>
<main class="card">
  <div class="logo">kimizo admin</div>
  <h1>Admin login</h1>
  <p class="sub">Only for store admins.</p>
  <form id="f">
    <label for="e">Email</label><input id="e" type="email" autocomplete="username" required>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <p id="err" role="alert"></p>
    <button class="btn" id="go">Log in</button>
  </form>
</main>
<script src="config.js"></script>
<script>
const API=((window.KZ&&window.KZ.API)||'').replace(/\/$/,'');
const $=id=>document.getElementById(id);
const clear=()=>{localStorage.removeItem('kza_token');localStorage.removeItem('kza_user')};

// already logged in? go straight to the panel
(async()=>{
  const t=localStorage.getItem('kza_token');if(!t)return;
  try{const r=await fetch(API+'/api/admin/check',{headers:{Authorization:'Bearer '+t}});if(r.ok)location.href='/';else clear()}catch{}
})();

$('f').onsubmit=async e=>{
  e.preventDefault();
  const b=$('go');b.disabled=true;$('err').textContent='';
  try{
    const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('e').value.trim(),password:$('p').value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Login failed');
    if(!d.user||d.user.role!=='admin')throw new Error('This account is not an admin account.');
    localStorage.setItem('kza_token',d.token);
    localStorage.setItem('kza_user',JSON.stringify(d.user));
    location.href='/';
  }catch(er){
    $('err').textContent=(er instanceof TypeError)?'Cannot reach the store server. Check the address in config.js and CORS (ADMIN_ORIGIN).':er.message;
    b.disabled=false;
  }
};
</script>
</body>
</html>
